{% extends "base.html" %} {% block content %}
<h2 class="mb-1">Ручной поиск</h2>
<p class="text-muted mb-4">
  Найти фильм, мультфильм или сериал, подобрать к нему раздачи и после проверки
  добавить их в каталог.
</p>

<!-- ШАГ 1 -->
<div class="card shadow-sm mb-4">
  <div class="card-header bg-dark border-secondary">
    <span class="badge bg-primary me-2">1</span> Поиск карточки
  </div>
  <div class="card-body">
    <div class="input-group">
      <input
        type="text"
        id="titleInput"
        class="form-control bg-dark text-light border-secondary"
        placeholder="Название, например: Дюна"
        onkeydown="if (event.key === 'Enter') searchCatalog()"
      />
      <button class="btn btn-primary" id="btnSearchCatalog" onclick="searchCatalog()">
        Искать
      </button>
    </div>
    <div id="catalogStatus" class="mt-3 text-muted"></div>
    <div id="candidates" class="row g-3 mt-1"></div>
  </div>
</div>

<!-- ШАГИ 2 и 3: поиск раздач, ручная проверка и привязка -->
<div id="picker"></div>

<script src="{{ url_for('static', filename='torrent_picker.js') }}"></script>
<script>
  let selectedMovie = null;

  function esc(text) {
    const div = document.createElement("div");
    div.textContent = text === null || text === undefined ? "" : text;
    return div.innerHTML;
  }

  function note(id, message, kind) {
    document.getElementById(id).innerHTML = kind
      ? `<div class="alert alert-${kind} py-2 mb-0">${message}</div>`
      : message;
  }

  // --- Шаг 1 ---
  function searchCatalog() {
    const query = document.getElementById("titleInput").value.trim();
    if (!query) return;

    document.getElementById("candidates").innerHTML = "";
    document.getElementById("picker").innerHTML = "";
    note("catalogStatus", "Ищем...");

    fetch("/api/search/catalog", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: query }),
    })
      .then((r) => r.json())
      .then((data) => {
        if (data.error) return note("catalogStatus", esc(data.error), "danger");
        if (!data.candidates.length)
          return note("catalogStatus", "Ничего не найдено ни в базе, ни в TMDB.", "warning");

        note(
          "catalogStatus",
          data.source === "database"
            ? `Найдено в базе: ${data.candidates.length}. Выберите карточку.`
            : `В базе нет. Найдено в TMDB: ${data.candidates.length}. Выберите карточку — она будет добавлена в базу.`
        );
        renderCandidates(data.candidates, data.source);
      })
      .catch((e) => note("catalogStatus", "Ошибка запроса: " + esc(e), "danger"));
  }

  function renderCandidates(items, source) {
    document.getElementById("candidates").innerHTML = items
      .map((item, index) => {
        const year = (item.year || (item.release_date || "").slice(0, 4)) || "—";
        const kind = item.media_type === "tv" ? "Сериал" : "Фильм";
        const poster = item.poster_url
          ? `<img src="${esc(item.poster_url)}" class="rounded me-3" style="width:60px">`
          : "";
        return `
        <div class="col-md-6">
          <div class="card h-100 border-secondary">
            <div class="card-body d-flex">
              ${poster}
              <div class="flex-grow-1">
                <div class="fw-bold">${esc(item.title)}</div>
                <div class="text-muted small">${esc(item.original_title || "")}</div>
                <div class="small mt-1">
                  <span class="badge bg-secondary">${kind}</span>
                  <span class="badge bg-dark border">${esc(year)}</span>
                  <span class="badge bg-dark border">★ ${esc(item.rating || 0)}</span>
                </div>
                <button class="btn btn-sm btn-primary mt-2" onclick="chooseCandidate(${index})">
                  Выбрать
                </button>
              </div>
            </div>
          </div>
        </div>`;
      })
      .join("");
    window._candidates = items;
    window._source = source;
  }

  function chooseCandidate(index) {
    const item = window._candidates[index];

    if (window._source === "database") {
      selectedMovie = item;
      startStep2();
      return;
    }

    note("catalogStatus", "Сохраняем карточку из TMDB в базу...");
    fetch("/api/search/save_candidate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ candidate: item }),
    })
      .then((r) => r.json())
      .then((data) => {
        if (data.error) return note("catalogStatus", esc(data.error), "danger");
        selectedMovie = data.movie;
        note("catalogStatus", `Карточка сохранена в базу (id ${data.movie.id}).`, "success");
        startStep2();
      });
  }

  // --- Шаг 2 ---
  function startStep2() {
    // Шаги 2 и 3 целиком в общем виджете: та же логика работает на карточке фильма.
    TorrentPicker.mount("picker", selectedMovie, { autoSearch: true });
  }
</script>
{% endblock %}
